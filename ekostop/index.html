<body>
  <div class="app-container">
    <div class="route-header d-flex align-center justify-between">
      <div class="d-flex align-center gap-3">
        <button class="back-btn hidden" id="back-btn" onclick="goBack()" title="Geri Dön">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="route-title m-0" id="header-title"></div>
      </div>
      <div class="route-actions d-flex gap-2">
        <button class="direction-btn" onclick="refreshData()" title="Verileri Yenile" style="background:var(--primary-soft); color:var(--primary-color); border-color:var(--primary-soft);">
          <i class="fas fa-sync-alt"></i>
        </button>
        <button class="direction-btn" onclick="window.centerToUserLocation()" title="Konumuma Git">
          <i class="fas fa-map-marker-alt"></i>
        </button>
        <button class="search-btn" onclick="openSearchPage()" title="Arama Sayfası">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>
    
    <div class="map-container" style="view-transition-name: ekostop-map;">
      <div id="map"></div>
    </div>
    
    <div class="route-info" id="bus-info"></div>
  </div>

  <script>
// Global variables
window.trackedBusPlate = null;
window.previousBusList = [];
window.isFirstBusLoad = true;
window.currentStopId = null;
window.keepMapPosition = false;
window.currentStopLat = null;
window.currentStopLng = null;
window.currentRegion = '004';
window.userLocation = null;
window.stopMarker = null;
window.busAnimations = {};

// Bus tracking functions
window.toggleBusTracking = function(plate) {
  document.querySelectorAll('.bus-info-card[data-plate]').forEach(item => {
    item.classList.remove('tracking-active');
  });

  if (window.trackedBusPlate === plate) {
    window.stopBusTracking();
  } else {
    if (window.trackedBusPlate) {
      window.stopBusTracking();
    }
    
    window.trackedBusPlate = plate;
    localStorage.setItem('trackedBusPlate', window.trackedBusPlate);
    
    const targetItem = document.querySelector(`.bus-info-card[data-plate="${plate}"]`);
    if (targetItem) {
      targetItem.classList.add('tracking-active');
      targetItem.classList.add('pulse-anim');
      setTimeout(() => targetItem.classList.remove('pulse-anim'), 400);
    }
    
    window.focusOnBus(plate);
  }
};

window.stopBusTracking = function() {
  window.trackedBusPlate = null;
  localStorage.removeItem('trackedBusPlate');
  document.querySelectorAll('.bus-info-card[data-plate]').forEach(item => {
    item.classList.remove('tracking-active'); 
  });
};

function openSearchPage() {
  window.location.href = '../ekoarama/index.html';
}

function goBack() {
  const backLink = getQueryParam('back');
  if (backLink) {
    window.location.href = decodeURIComponent(backLink);
  } else {
    window.history.back();
  }
}

function getQueryParam(param) {
  const params = new URLSearchParams(window.location.search);
  return params.get(param);
}

function refreshData() {
  const refreshBtn = document.querySelector('.direction-btn');
  refreshBtn.classList.add('loading');
  
  centerOnStop();
  if (window.currentStopId) {
    window.keepMapPosition = true;
    fetchStopData(window.currentStopId).finally(() => {
      setTimeout(() => {
        refreshBtn.classList.remove('loading');
      }, 500);
    });
  }
}

function centerOnStop() {
  if (window.currentStopLat != null && window.currentStopLng != null) {
    window.focusOnLocation([window.currentStopLat, window.currentStopLng], 15);
  }
}

function getUserLocation() {
  if (!window.EkoLocation) return;

  window.EkoLocation.onUpdate((coords) => {
    const userPos = [coords.lat, coords.lng];
    window.userLocation = userPos;
    window.addUserLocationToMap(userPos);
  });

  window.EkoLocation.onError((err) => {
    console.warn('[EkoStop] Konum alınamadı:', err);
  });
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
            Math.cos(φ1) * Math.cos(φ2) *
            Math.sin(Δλ/2) * Math.sin(Δλ/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function formatDistance(distance) {
  return distance >= 1000 ? (distance / 1000).toFixed(1) + " km" : Math.round(distance) + " m";
}

window.calculateSmartETA = function(distance, stopDiff, vehicleType) {
  const routeCurvatureFactor = 1.28;
  const estimatedRoadDistance = distance * routeCurvatureFactor;
  let baseSpeed = 11.1; 
  if (vehicleType === 2) baseSpeed = 8.3;  
  if (vehicleType === 3) baseSpeed = 16.6; 
  if (vehicleType === 5) baseSpeed = 7.7;  
  const now = new Date();
  const hour = now.getHours();
  const day = now.getDay();
  let trafficFactor = 1.0;
  const isWeekend = (day === 0 || day === 6);
  if (!isWeekend) {
    if ((hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19.5)) {
      trafficFactor = 1.45;
    } else if (hour >= 12 && hour <= 14) {
      trafficFactor = 1.15;
    }
  }
  let travelTime = (estimatedRoadDistance / baseSpeed) * trafficFactor;
  let dwellTimePerStop = 25;
  if (vehicleType === 2) dwellTimePerStop = 20; 
  if (vehicleType === 3) dwellTimePerStop = 30; 
  if (stopDiff > 0) {
    const intermediateStops = Math.max(0, stopDiff - 1);
    travelTime += intermediateStops * dwellTimePerStop;
  } else {
    const estimatedStops = Math.floor(estimatedRoadDistance / 400);
    travelTime += Math.max(0, estimatedStops - 1) * dwellTimePerStop;
  }
  const trafficLightDelay = Math.floor(estimatedRoadDistance / 1000) * 30;
  travelTime += trafficLightDelay;
  let etaMinutes = Math.round(travelTime / 60);
  if (distance > 50 && etaMinutes < 1) { etaMinutes = 1; }
  if (distance <= 50 && stopDiff <= 1) { etaMinutes = 0; }
  return etaMinutes;
};

function getVehicleTypeForRoute(route) {
  // 1. URL parametresi varsa en üst öncelik o (Global durak tipi zorlaması)
  const params = new URLSearchParams(window.location.search);
  const urlType = params.get('type');
  if (urlType) return parseInt(urlType);
  
  // 2. Manual Mapping (specialVehicles)
  if (!window.APP_DATA) return 1;
  const region = window.currentRegion;
  const specials = window.APP_DATA.regions[region]?.specialVehicles || [];
  const found = specials.find(v => v.split(',')[0] === route);
  return found ? parseInt(found.split(',')[1]) : 1;
}

function transferBus(route, direction) {
  const backLink = encodeURIComponent(window.location.href);
  const region = window.currentRegion;
  
  // Araç tipi tespiti (Manual Mapping)
  let type = 1;
  const regions = window.APP_DATA?.regions;
  if (regions && regions[region]) {
    const specials = regions[region].specialVehicles || [];
    const found = specials.find(v => v.split(',')[0] === route);
    if (found) type = found.split(',')[1];
  }

  const targetUrl = `../ekorota/index.html?region=${region}&route=${route}&direction=${direction}&type=${type}&back=${backLink}`;
  window.location.href = targetUrl;
}

// Basit otobüs animasyonu fonksiyonu (ekostop için özelleştirilmiş)
// Hat kodunu da parametre olarak alan animasyon fonksiyonu
// Akıcı ve Tahminli Otobüs Hareketi (Sürekli Akış Sistemi - ekostop)
function animateBusToPosition(busPlate, startPos, endPos, bearing, duration = 10000, routeCode = null, vehicleType = 1) {
  if (window.busAnimations && window.busAnimations[busPlate]) {
    cancelAnimationFrame(window.busAnimations[busPlate].animationId);
  }
  
  if (!window.busAnimations) window.busAnimations = {};

  const startTime = performance.now();
  let startBearing = bearing;
  
  if (window.prevBusPositions[busPlate] && window.prevBusPositions[busPlate].bearing !== undefined) {
    startBearing = window.prevBusPositions[busPlate].bearing;
  }

  function animate(currentTime) {
    const elapsed = currentTime - startTime;
    let progress = Math.min(1, elapsed / duration);
    let easedProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

    const currentPos = [
      startPos[0] + (endPos[0] - startPos[0]) * easedProgress,
      startPos[1] + (endPos[1] - startPos[1]) * easedProgress
    ];

    let currentBearing = bearing;
    if (startBearing !== bearing) {
      let angleDiff = ((bearing - startBearing + 180) % 360) - 180;
      if (angleDiff < -180) angleDiff += 360;
      currentBearing = startBearing + angleDiff * easedProgress;
    }

    const marker = window.activeBusMarkers[busPlate];
    if (marker) {
      marker.setLatLng(currentPos);
      const displayText = routeCode || busPlate || 'Bilinmiyor';
      const updatedIcon = window.createBusIconWithPlate(displayText, currentBearing, vehicleType);
      marker.setIcon(updatedIcon);

      if (window.trackedBusPlate === busPlate && !window.isFlying) {
        window.map.panTo(currentPos, { animate: true, duration: 0.2 });
      }
    }

    if (progress < 1) {
      window.busAnimations[busPlate].animationId = requestAnimationFrame(animate);
    }
  }

  window.busAnimations[busPlate] = {
    animationId: requestAnimationFrame(animate)
  };
}

function updateBusListWithAnimation(sortedBuses, stopLat, stopLng, stopInfo) {
  const newBusPlates = sortedBuses.map(bus => bus.plate);
  const usedNames = new Set();
  
  let busesHTML = sortedBuses.map((bus, index) => {
    const busLat = parseFloat(bus.lat);
    const busLng = parseFloat(bus.lng);
    const distance = calculateDistance(busLat, busLng, stopLat, stopLng);
    const formattedDistance = formatDistance(distance);
    
    const isTracked = window.trackedBusPlate === bus.plate;
    const vehicleType = getVehicleTypeForRoute(bus.displayRouteCode);
    const eta = window.calculateSmartETA(distance, parseInt(bus.stopDiff) || 0, vehicleType);
    
    let iconClass = 'fa-bus';
    if (vehicleType === 2) iconClass = 'fa-tram';
    else if (vehicleType === 3 || vehicleType === 6) iconClass = 'fa-train-subway';
    else if (vehicleType === 5) iconClass = 'fa-ship';
    else if (vehicleType === 4) iconClass = 'fa-cable-car';

    const isApproaching = bus.stopDiff <= 3;
    const transferUrl = `../ekorota/index.html?region=${window.currentRegion}&route=${bus.displayRouteCode || (bus.routeCode ? bus.routeCode.replace(/^41/, '') : 'N/A')}&direction=${bus.direction}&type=${vehicleType}&back=${encodeURIComponent(window.location.href)}`;

    const rightBoxHtml = `
      <div class="card-status-orb" onclick="event.stopPropagation(); window.location.href='${transferUrl}'" style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 10px; background:${isApproaching ? 'var(--success-light)' : 'transparent'}; border:${isApproaching ? '1px solid var(--success-border)' : '1px solid var(--border-light)'}; cursor:pointer; transition:all 0.2s;">
        <span style="font-size:1.2rem; font-weight:var(--font-weight-black); color:${isApproaching ? 'var(--success-color)' : 'var(--primary-color)'}; line-height:1;">${eta} <span style="font-size:0.75rem;">dk</span></span>
        <span style="font-size:0.7rem; color:var(--text-muted); font-weight:600;">${formattedDistance}</span>
      </div>
    `;

    const bottomBoxHtml = `
      <div class="route-details" style="margin-top:6px; display:flex; flex-direction:column; gap:4px;">
        <div style="font-size:0.75rem; color:var(--text-secondary); display:flex; align-items:center; gap:6px;">
          <i class="fas fa-arrow-right" style="color:var(--primary-light); font-size:0.65rem;"></i>
          <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px;">${bus.displayName || 'Bilinmiyor'}</span>
        </div>
        <div style="display:inline-flex; align-items:center; gap:5px; background:var(--background-soft); border:1px solid var(--border-light); padding:3px 8px; border-radius:6px; width:fit-content;">
          <i class="fas fa-map-marker-alt" style="color:var(--text-muted); font-size:0.65rem;"></i>
          <span style="font-size:0.7rem; font-weight:600; color:var(--text-secondary);">Size <strong style="color:var(--primary-color);">${bus.stopDiff || 0}</strong> durak mesafede</span>
        </div>
      </div>
    `;

    let safePlateName = bus.plate.replace(/[^a-zA-Z0-9]/g, '-');
    let finalName = `bus-card-${safePlateName}`;
    let counter = 1;
    while(usedNames.has(finalName)) {
      finalName = `bus-card-${safePlateName}-${counter}`;
      counter++;
    }
    usedNames.add(finalName);

    return `<div id="${finalName}" class="bus-info-card ${isTracked ? 'tracking-active' : ''}" data-plate="${bus.plate}" onclick="window.toggleBusTracking('${bus.plate}')">
      <div class="card-glow" style="background: ${isApproaching ? 'var(--success-color)' : 'var(--primary-color)'};">
        <div class="sequence-mini">#${index + 1}</div>
      </div>
      
      <div class="card-main">
        <div class="bus-id-section">
          <div class="bus-icon-pill">
            <i class="fas ${iconClass}"></i>
          </div>
          <div class="plate-number">${bus.displayRouteCode || 'Bilinmiyor'}</div>
          <div style="font-size:0.75rem; color:var(--text-muted); font-weight:600; margin-left:4px;">(${bus.plate})</div>
        </div>
        ${bottomBoxHtml}
      </div>

      ${rightBoxHtml}
    </div>`;
  }).join('');

  const gridContainer = document.querySelector('.bus-cards-grid');
  
  // FLIP: F (First) - Eski pozisyonları kaydet
  let firstPositions = {};
  if (gridContainer && !window.isFirstBusLoad) {
    Array.from(gridContainer.children).forEach(child => {
      if(child.id) firstPositions[child.id] = child.getBoundingClientRect().top;
    });
  }

  // DOM Güncellemesi
  if (gridContainer && !window.isFirstBusLoad) {
    gridContainer.innerHTML = busesHTML;
    const countBadge = document.querySelector('.count-badge');
    if (countBadge) countBadge.textContent = sortedBuses.length;
  } else {
    document.getElementById('bus-info').innerHTML = `
      <div class="section-container first-section">
        <div class="section-meta-label">${stopInfo ? stopInfo.busStopName : 'Bilinmeyen Durak'}</div>
        <h3 class="section-title">
          <i class="fas fa-bus-alt"></i>Aktif Otobüsler
          <span class="count-badge">${sortedBuses.length}</span>
        </h3>
        <div class="bus-cards-grid">${busesHTML}</div>
      </div>
    `;
  }

  // Tracking durumunu aktar
  if (window.trackedBusPlate && newBusPlates.includes(window.trackedBusPlate)) {
    const targetItem = document.querySelector(`.bus-info-card[data-plate="${window.trackedBusPlate}"]`);
    if (targetItem) targetItem.classList.add('tracking-active');
  } else if (window.trackedBusPlate && !newBusPlates.includes(window.trackedBusPlate)) {
    window.stopBusTracking();
  }

  // FLIP: L (Last), I (Invert), P (Play) - Animasyonu tetikle
  const activeGrid = document.querySelector('.bus-cards-grid');
  if (activeGrid && Object.keys(firstPositions).length > 0) {
    Array.from(activeGrid.children).forEach(child => {
      if (child.id && firstPositions[child.id] !== undefined) {
        const lastTop = child.getBoundingClientRect().top;
        const firstTop = firstPositions[child.id];
        const deltaY = firstTop - lastTop;
        
        if (deltaY !== 0) {
          // Invert
          child.style.transform = `translateY(${deltaY}px)`;
          child.style.transition = 'none';
          
          // Play
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              child.style.transition = 'transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1)';
              child.style.transform = '';
            });
          });
        }
      } else {
        // Yeni Gelen Otobüs Animasyonu
        child.style.opacity = '0';
        child.style.transform = 'translateY(15px)';
        child.style.transition = 'none';
        
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            child.style.transition = 'all 0.4s ease';
            child.style.opacity = '1';
            child.style.transform = '';
          });
        });
      }
    });
  }

  if (window.isFirstBusLoad) window.isFirstBusLoad = false;
  window.previousBusList = [...sortedBuses];
}

async function fetchStopData(stopId) {
  const url = `https://service.kentkart.com/rl1//web/nearest/bus?region=${window.currentRegion}&lang=tr&authType=4&accuracy=0&busStopId=${stopId}&version=Web_1.8.1(32)_1.0_FIREFOX_kentkart.web.mkentkart`;
  try {
    const { data } = await axios.get(url);
    displayData(data);
    return data;
  } catch (error) {
    document.getElementById('bus-info').innerHTML = `
      <div class="info-item" style="color:#f56565;">
        Hata: ${error.message}
      </div>`;
    throw error;
  }
}

function displayData(data) {
  window.currentStopId = data.stopInfo.busStopId;
  
  // Header'ı güncelle - Dominant tipi algıla (URL'de yoksa)
  const buses = data.busList || [];
  let stopType = 1;
  const urlParams = new URLSearchParams(window.location.search);
  const urlType = urlParams.get('type');
  
  if (urlType) {
    stopType = parseInt(urlType);
  } else {
    // 1. Manual Mapping (specialStops) kontrolü
    const specials = (window.APP_DATA && window.APP_DATA.regions[window.currentRegion]?.specialStops) || [];
    const foundStop = specials.find(s => s.split(',')[0] === String(window.currentStopId));
    
    if (foundStop) {
      // Virgül varsa tipi al, yoksa varsayılan 2 (Tramvay) yap
      stopType = foundStop.includes(',') ? parseInt(foundStop.split(',')[1]) : 2;
    } else {
      // 2. Gelen otobüslerden specialVehicle olanı bul (Otomatik algılama)
      const specialBus = buses.find(bus => getVehicleTypeForRoute(bus.displayRouteCode) > 1);
      if (specialBus) {
        stopType = getVehicleTypeForRoute(specialBus.displayRouteCode);
      }
    }
  }

  // Header ikonu ve ismi
  let headerIconClass = 'fa-bus';
  if (stopType === 2) headerIconClass = 'fa-tram';
  else if (stopType === 3 || stopType === 6) headerIconClass = 'fa-train-subway';
  else if (stopType === 5) headerIconClass = 'fa-ship';
  else if (stopType === 4) headerIconClass = 'fa-cable-car';

  const stopId = getQueryParam('stop');
  document.getElementById('header-title').innerHTML = `Durak: ${stopId || data.stopInfo.busStopId}`;

  const backParam = getQueryParam('back');
  if(backParam) {
    document.getElementById('back-btn').classList.remove('hidden');
  }

  const stopLat = parseFloat(data.stopInfo.lat);
  const stopLng = parseFloat(data.stopInfo.lng);
  
  window.currentStopLat = stopLat;
  window.currentStopLng = stopLng;

  // Durak marker'ını haritaya ekle
  if (window.stopMarker) {
    window.map.removeLayer(window.stopMarker);
  }
  
  const stopIcon = window.createStopIcon({
    stopName: data.stopInfo.busStopName || data.stopInfo.stopName || "",
    index: "" 
  }, false, false, false);
  window.stopMarker = L.marker([stopLat, stopLng], {
    icon: stopIcon,
    zIndexOffset: 1000
  }).addTo(window.map);
  
  if (!window.keepMapPosition) {
    window.focusOnLocation([stopLat, stopLng], 15);
  } else {
    window.keepMapPosition = false;
  }

  const newBusPlates = new Set(data.busList.map(bus => bus.plate));
  
  // Eski otobüs marker'larını temizle
  window.clearBusMarkers(Array.from(newBusPlates));

  const sortedBuses = data.busList.sort((a, b) => {
    const distA = calculateDistance(parseFloat(a.lat), parseFloat(a.lng), stopLat, stopLng);
    const distB = calculateDistance(parseFloat(b.lat), parseFloat(b.lng), stopLat, stopLng);
    return distA - distB;
  });

  sortedBuses.forEach(bus => {
    const busLat = parseFloat(bus.lat);
    const busLng = parseFloat(bus.lng);
    
    if (window.activeBusMarkers[bus.plate]) {
      const marker = window.activeBusMarkers[bus.plate];
      
      // Basit animasyon fonksiyonunu kullan
      if (window.prevBusPositions[bus.plate]) {
        const oldPos = window.prevBusPositions[bus.plate];
        const newPos = [busLat, busLng];
        
        // Eğer pozisyon değiştiyse animasyon yap
        if (Math.abs(oldPos.lat - busLat) > 0.0001 || Math.abs(oldPos.lng - busLng) > 0.0001) {
          animateBusToPosition(
            bus.plate, 
            [oldPos.lat, oldPos.lng], 
            newPos, 
            bus.bearing || 0,
            8000, // 8 saniye animasyon
            bus.displayRouteCode, // Hat kodunu da gönder
            getVehicleTypeForRoute(bus.displayRouteCode)
          );
        } else {
          // Pozisyon değişmemişse sadece ikonu güncelle (hat kodu ile)
          const type = getVehicleTypeForRoute(bus.displayRouteCode);
          const newIcon = window.createBusIconWithPlate(bus.displayRouteCode || bus.plate || 'Bilinmiyor', bus.bearing || 0, type);
          marker.setIcon(newIcon);
        }
      } else {
        // İlk kez görülüyorsa direkt pozisyon ayarla (hat kodu ile)
        const type = getVehicleTypeForRoute(bus.displayRouteCode);
        const newIcon = window.createBusIconWithPlate(bus.displayRouteCode || bus.plate || 'Bilinmiyor', bus.bearing || 0, type);
        marker.setIcon(newIcon);
        marker.setLatLng([busLat, busLng]);
      }
      
      window.prevBusPositions[bus.plate] = { lat: busLat, lng: busLng, bearing: bus.bearing || 0 };
      
    } else {
      // Yeni otobüs marker'ı oluştur (hat kodu ile)
      const busData = {
        ...bus,
        plateNumber: bus.displayRouteCode || bus.plate || 'Bilinmiyor', // Hat kodunu göster
        lat: busLat,
        lng: busLng,
        bearing: bus.bearing || 0
      };
      
      const marker = window.createOrUpdateBusMarker(busData, true);
      
      // Manuel olarak tıklama event'i ekle - haritada otobüse tıklayınca takip et
      marker.on('click', function(e) {
        e.target.closePopup();
        window.toggleBusTracking(bus.plate); // Takip etmeye başla
      });
      
      window.activeBusMarkers[bus.plate] = marker;
      window.prevBusPositions[bus.plate] = { lat: busLat, lng: busLng, bearing: bus.bearing || 0 };
    }
  });

  updateBusListWithAnimation(sortedBuses, stopLat, stopLng, data.stopInfo);
}

async function fetchConfig() {
  try {
    const res = await fetch('../ekodata/kentkartinfo.json');
    window.APP_DATA = await res.json();
  } catch (e) {
    console.error('Config fetch error:', e);
  }
}

function init() {
  const stopId = getQueryParam('stop');
  
  window.currentRegion = getQueryParam('region') || '004';
  
  // Config yükle (Special vehicles için)
  fetchConfig();
  
  // Load tracked bus from localStorage
  window.trackedBusPlate = localStorage.getItem('trackedBusPlate');
  
  window.isFirstBusLoad = true;
  window.previousBusList = [];
  
  // Initialize map using map.js functions
  window.initializeMap();
  
  getUserLocation();
  
  if(stopId) {
    // Set initial header title with stop ID from URL
    document.getElementById('header-title').textContent = `Durak: ${stopId}`;
    
    fetchStopData(stopId);
    
    setInterval(() => {
      window.keepMapPosition = true;
      fetchStopData(stopId);
    }, 10000);
    // Konum güncellemeleri watchPosition ile yapıldığı için setInterval(getUserLocation) kaldırıldı
  } else {
    document.getElementById('bus-info').innerHTML = `
      <div class="info-item" style="color:#f56565;">
        Hata: "stop" parametresi belirtilmedi.
      </div>`;
  }
}

window.onload = init;
  </script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js', { scope: '../' })
          .catch(err => console.log('SW Registration failed:', err));
      });
    }
  </script>
